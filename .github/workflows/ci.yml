name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate source and dependencies
        run: |
          python -m py_compile bot.py
          python -c "from dotenv import load_dotenv; from telegram import Bot; from telegram.error import NetworkError, TelegramError, TimedOut"
          python -m pip check
